[project]
name = "solution-gen"
version = "0.2.0"
description = "方案生产：dsh web 对话 + skill 后端硬门"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.34.0",
    "python-docx>=1.1.0",
    "httpx>=0.28.0",
    "cairosvg>=2.7.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dsh = ["deepseek-harness-sdk==0.1.0rc6"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.14.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solution_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
