<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青岛低空项目总体框架图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .subtitle {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--color-muted);
      margin-top: -1rem;
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · 低空经济项目</p>
    <h1>青岛低空项目总体框架图</h1>
    <p class="subtitle">1套运营服务保障体系 · 1批新型基础设施 · 1系列场景应用</p>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="qdla-title qdla-desc">
      <title id="qdla-title">青岛低空项目总体框架图</title>
      <desc id="qdla-desc">自下而上展示规划设计层、基础设施层、运营平台层、场景应用层四层架构，右侧运营服务保障体系贯穿各层。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="60" y="32" width="620" height="104" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="60" y="36" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="108" y="45" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">场景应用层</text>

      <rect x="60" y="152" width="620" height="104" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="60" y="156" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="108" y="165" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">运营平台层</text>

      <rect x="60" y="272" width="620" height="104" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="60" y="276" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="108" y="285" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">基础设施层</text>

      <rect x="60" y="392" width="620" height="96" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="60" y="396" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="108" y="405" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">规划设计层</text>

      <rect x="740" y="32" width="220" height="456" rx="8" fill="rgba(235,108,54,0.04)" stroke="rgba(235,108,54,0.40)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="740" y="36" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="800" y="45" fill="rgba(235,108,54,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">运营服务保障体系</text>

      <!-- Arrows: primary flow (bottom-up) -->
      <line x1="250" y1="420" x2="250" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="490" y1="420" x2="490" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="250" y1="304" x2="250" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="490" y1="304" x2="490" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="370" y1="184" x2="370" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrows: support flow (right to left, dashed) -->
      <line x1="764" y1="96" x2="600" y2="96" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="764" y1="216" x2="600" y2="216" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="764" y1="336" x2="600" y2="336" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="764" y1="448" x2="600" y2="448" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Node: 低空场景运营平台 -->
      <rect x="140" y="64" width="460" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="140" y="64" width="460" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="148" y="70" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="170" y="79" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="370" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">低空场景运营平台</text>
      <text x="370" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">物流配送 · 巡检监测 · 应急救援 · 文旅观光</text>

      <!-- Node: 低空飞行综合运营服务平台 (focal coral) -->
      <rect x="140" y="184" width="460" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="140" y="184" width="460" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="148" y="190" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="170" y="199" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="370" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">低空飞行综合运营服务平台</text>
      <text x="370" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">飞行计划 · 空域管理 · 运营调度 · 安全监管</text>

      <!-- Node: 低空智联网设施 -->
      <rect x="140" y="304" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="140" y="304" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="148" y="310" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="170" y="319" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IOT</text>
      <text x="250" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">低空智联网设施</text>
      <text x="250" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">通信 · 导航 · 监视</text>

      <!-- Node: 无人机及起降场设备 -->
      <rect x="380" y="304" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="304" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="388" y="310" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="410" y="319" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UAV</text>
      <text x="490" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">无人机及起降场设备</text>
      <text x="490" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">起降场 · 机库 · 无人机装备</text>

      <!-- Node: 低空规划设计 -->
      <rect x="140" y="420" width="460" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="140" y="420" width="460" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="148" y="426" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="170" y="435" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAN</text>
      <text x="370" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">低空规划设计</text>
      <text x="370" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">空域规划 · 航线规划 · 起降点布局</text>

      <!-- Node: 运营服务保障中心 -->
      <rect x="764" y="112" width="172" height="160" rx="6" fill="#f5f5f5"/>
      <rect x="764" y="112" width="172" height="160" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="772" y="118" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="794" y="127" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPS</text>
      <text x="850" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">运营服务保障中心</text>
      <text x="850" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">指挥调度 · 运维保障 · 培训服务</text>

      <!-- Legend -->
      <line x1="60" y1="508" x2="940" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">图例</text>

      <line x1="140" y1="530" x2="168" y2="530" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="176" y="533" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">层级支撑流</text>

      <line x1="300" y1="530" x2="328" y2="530" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="336" y="533" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">保障服务流</text>

      <rect x="448" y="524" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="468" y="533" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">核心平台</text>
    </svg>
  </div>
</body>
</html>
